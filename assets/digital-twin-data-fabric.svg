<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 720" width="1160" height="720" role="img" aria-label="Animated diagram: eight healthcare data sources streaming into a human figure that represents a women's health digital twin, which outputs twin state and a decision.">
  <title>Women's Health Digital Twin — Data Fabric</title>
  <desc>Eight digital thread sources (Epic and FHIR, labs and vitals, imaging and procedures, claims and coverage, wearables and remote monitoring, patient-reported outcomes, social determinants and access, genomics and family history) stream continuously into a patient digital twin, which maintains state and drives a decision.</desc>

  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C026D3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bodyFill" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="headerRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softenSm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- thread paths: left sources into the twin core -->
    <path id="t1" d="M258,168 C 372,168 430,240 536,266" fill="none"/>
    <path id="t2" d="M258,272 C 372,272 440,282 536,294" fill="none"/>
    <path id="t3" d="M258,376 C 372,376 440,340 536,322" fill="none"/>
    <path id="t4" d="M258,480 C 372,480 440,392 538,350" fill="none"/>
    <!-- thread paths: right sources into the twin core -->
    <path id="t5" d="M902,168 C 788,168 730,240 624,266" fill="none"/>
    <path id="t6" d="M902,272 C 788,272 720,282 624,294" fill="none"/>
    <path id="t7" d="M902,376 C 788,376 720,340 624,322" fill="none"/>
    <path id="t8" d="M902,480 C 788,480 720,392 622,350" fill="none"/>
    <!-- twin state output path -->
    <path id="tOut" d="M580,606 C 580,630 580,634 580,648" fill="none"/>
  </defs>

  <rect width="1160" height="720" fill="#080C18"/>
  <rect width="1160" height="720" fill="url(#bodyFill)" opacity="0.35"/>

  <!-- ===== header ===== -->
  <text x="48" y="52" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#F1F5F9">Women&#8217;s Health Digital Twin &#8212; Data Fabric</text>
  <text x="48" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#7C8DA6" letter-spacing="1.6">DIGITAL THREAD (CONTINUOUS)  &gt;&gt;  TWIN STATE  &gt;&gt;  DECISION</text>
  <rect x="48" y="88" width="420" height="2" fill="url(#headerRule)"/>

  <!-- ===== thread lines ===== -->
  <g fill="none" stroke-linecap="round">
    <use xlink:href="#t1" href="#t1" stroke="#38BDF8" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t2" href="#t2" stroke="#22D3EE" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t3" href="#t3" stroke="#818CF8" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t4" href="#t4" stroke="#A78BFA" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t5" href="#t5" stroke="#34D399" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t6" href="#t6" stroke="#FBBF24" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t7" href="#t7" stroke="#FB923C" stroke-opacity="0.26" stroke-width="1.6"/>
    <use xlink:href="#t8" href="#t8" stroke="#F472B6" stroke-opacity="0.26" stroke-width="1.6"/>
  </g>

  <!-- flowing packets along each thread -->
  <g>
    <circle r="3.6" fill="#7DD3FC"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#t1" href="#t1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="3.6s" repeatCount="indefinite" begin="0s"/></circle>
    <circle r="2.4" fill="#7DD3FC" opacity="0.7"><animateMotion dur="3.6s" repeatCount="indefinite" begin="1.8s"><mpath xlink:href="#t1" href="#t1"/></animateMotion></circle>

    <circle r="3.6" fill="#67E8F9"><animateMotion dur="2.9s" repeatCount="indefinite" begin="0.4s"><mpath xlink:href="#t2" href="#t2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="2.9s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle r="2.4" fill="#67E8F9" opacity="0.7"><animateMotion dur="2.9s" repeatCount="indefinite" begin="1.9s"><mpath xlink:href="#t2" href="#t2"/></animateMotion></circle>

    <circle r="3.6" fill="#A5B4FC"><animateMotion dur="4.4s" repeatCount="indefinite" begin="0.9s"><mpath xlink:href="#t3" href="#t3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="4.4s" repeatCount="indefinite" begin="0.9s"/></circle>

    <circle r="3.6" fill="#C4B5FD"><animateMotion dur="5.2s" repeatCount="indefinite" begin="1.4s"><mpath xlink:href="#t4" href="#t4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="5.2s" repeatCount="indefinite" begin="1.4s"/></circle>

    <circle r="3.6" fill="#6EE7B7"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.2s"><mpath xlink:href="#t5" href="#t5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="2.2s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle r="2.4" fill="#6EE7B7" opacity="0.75"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#t5" href="#t5"/></animateMotion></circle>

    <circle r="3.6" fill="#FCD34D"><animateMotion dur="4.8s" repeatCount="indefinite" begin="0.7s"><mpath xlink:href="#t6" href="#t6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="4.8s" repeatCount="indefinite" begin="0.7s"/></circle>

    <circle r="3.6" fill="#FDBA74"><animateMotion dur="6s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#t7" href="#t7"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="6s" repeatCount="indefinite" begin="1.1s"/></circle>

    <circle r="3.6" fill="#F9A8D4"><animateMotion dur="7.2s" repeatCount="indefinite" begin="2s"><mpath xlink:href="#t8" href="#t8"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="7.2s" repeatCount="indefinite" begin="2s"/></circle>
  </g>

  <!-- ===== source nodes ===== -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- LEFT 1 -->
    <g>
      <rect x="48" y="136" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="48" y="136" width="3.5" height="64" rx="1.75" fill="#38BDF8"/>
      <circle cx="70" cy="160" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="84" y="164" font-size="13.5" font-weight="600" fill="#E2E8F0">Epic &#183; FHIR R4</text>
      <text x="70" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Condition &#183; Encounter &#183; Procedure</text>
    </g>
    <!-- LEFT 2 -->
    <g>
      <rect x="48" y="240" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="48" y="240" width="3.5" height="64" rx="1.75" fill="#22D3EE"/>
      <circle cx="70" cy="264" r="4" fill="#22D3EE"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="84" y="268" font-size="13.5" font-weight="600" fill="#E2E8F0">Labs &amp; Vitals</text>
      <text x="70" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">BP series &#183; lipids &#183; A1c &#183; CBC</text>
    </g>
    <!-- LEFT 3 -->
    <g>
      <rect x="48" y="344" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="48" y="344" width="3.5" height="64" rx="1.75" fill="#818CF8"/>
      <circle cx="70" cy="368" r="4" fill="#818CF8"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <text x="84" y="372" font-size="13.5" font-weight="600" fill="#E2E8F0">Imaging &amp; Procedures</text>
      <text x="70" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Laparoscopy &#183; US &#183; pathology</text>
    </g>
    <!-- LEFT 4 -->
    <g>
      <rect x="48" y="448" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="48" y="448" width="3.5" height="64" rx="1.75" fill="#A78BFA"/>
      <circle cx="70" cy="472" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;0.25;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <text x="84" y="476" font-size="13.5" font-weight="600" fill="#E2E8F0">Claims &amp; Coverage</text>
      <text x="70" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Out-of-network &#183; eligibility</text>
    </g>

    <!-- RIGHT 1 -->
    <g>
      <rect x="902" y="136" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="1108.5" y="136" width="3.5" height="64" rx="1.75" fill="#34D399"/>
      <circle cx="924" cy="160" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="938" y="164" font-size="13.5" font-weight="600" fill="#E2E8F0">Wearables &amp; RPM</text>
      <text x="924" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Home BP &#183; HR &#183; sleep &#183; activity</text>
    </g>
    <!-- RIGHT 2 -->
    <g>
      <rect x="902" y="240" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="1108.5" y="240" width="3.5" height="64" rx="1.75" fill="#FBBF24"/>
      <circle cx="924" cy="264" r="4" fill="#FBBF24"><animate attributeName="opacity" values="1;0.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <text x="938" y="268" font-size="13.5" font-weight="600" fill="#E2E8F0">Patient-Reported</text>
      <text x="924" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Symptoms &#183; PROMs &#183; attendance</text>
    </g>
    <!-- RIGHT 3 -->
    <g>
      <rect x="902" y="344" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="1108.5" y="344" width="3.5" height="64" rx="1.75" fill="#FB923C"/>
      <circle cx="924" cy="368" r="4" fill="#FB923C"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <text x="938" y="372" font-size="13.5" font-weight="600" fill="#E2E8F0">SDOH &amp; Access</text>
      <text x="924" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Language &#183; transport &#183; distance</text>
    </g>
    <!-- RIGHT 4 -->
    <g>
      <rect x="902" y="448" width="210" height="64" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
      <rect x="1108.5" y="448" width="3.5" height="64" rx="1.75" fill="#F472B6"/>
      <circle cx="924" cy="472" r="4" fill="#F472B6"><animate attributeName="opacity" values="1;0.25;1" dur="4.6s" repeatCount="indefinite"/></circle>
      <text x="938" y="476" font-size="13.5" font-weight="600" fill="#E2E8F0">History &amp; Genomics</text>
      <text x="924" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7C8DA6">Reproductive hx &#183; family hx</text>
    </g>
  </g>

  <!-- ===== the twin ===== -->
  <g>
    <!-- ambient aura -->
    <ellipse cx="580" cy="330" rx="150" ry="215" fill="url(#coreGlow)" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.62;0.35" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- containment ring: the sandbox boundary -->
    <ellipse cx="580" cy="368" rx="128" ry="232" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 9" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0 580 368" to="360 580 368" dur="60s" repeatCount="indefinite"/>
    </ellipse>

    <!-- body mass -->
    <g fill="url(#bodyFill)" stroke="none" opacity="0.9">
      <path d="M580,214 C 604,214 622,224 630,244 L 640,300 C 644,330 636,352 626,372 L 620,404 C 622,452 618,506 612,556 L 606,600 L 588,600 L 584,506 L 580,470 L 576,506 L 572,600 L 554,600 L 548,556 C 542,506 538,452 540,404 L 534,372 C 524,352 516,330 520,300 L 530,244 C 538,224 556,214 580,214 Z"/>
    </g>

    <!-- body wireframe -->
    <g fill="none" stroke="#93C5FD" stroke-opacity="0.75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="580" cy="182" r="27"/>
      <path d="M580,209 L580,216"/>
      <path d="M580,214 C 604,214 622,224 630,244 L 640,300 C 644,330 636,352 626,372 L 620,404 C 622,452 618,506 612,556 L 606,600"/>
      <path d="M580,214 C 556,214 538,224 530,244 L 520,300 C 516,330 524,352 534,372 L 540,404 C 538,452 542,506 548,556 L 554,600"/>
      <path d="M580,404 L580,470"/>
      <!-- arms -->
      <path d="M632,248 C 654,286 662,338 658,392 L 652,428"/>
      <path d="M528,248 C 506,286 498,338 502,392 L 508,428"/>
      <!-- structural cross-sections -->
      <path d="M534,258 L626,258" stroke-opacity="0.3"/>
      <path d="M528,312 L632,312" stroke-opacity="0.3"/>
      <path d="M536,372 L624,372" stroke-opacity="0.3"/>
      <path d="M542,404 L618,404" stroke-opacity="0.3"/>
      <path d="M580,216 L580,404" stroke-opacity="0.28"/>
      <!-- feet -->
      <path d="M606,600 L620,606" stroke-opacity="0.6"/>
      <path d="M554,600 L540,606" stroke-opacity="0.6"/>
    </g>

    <!-- scanning simulation sweep -->
    <rect x="450" y="160" width="260" height="2.5" fill="url(#scanLine)" opacity="0.9">
      <animate attributeName="y" values="160;600;160" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.08;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- cardiac node -->
    <g>
      <circle cx="566" cy="288" r="16" fill="#F87171" opacity="0.16" filter="url(#softenSm)">
        <animate attributeName="r" values="12;22;12" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.05;0.3" dur="1.15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="566" cy="288" r="5.5" fill="#FCA5A5">
        <animate attributeName="r" values="5;6.8;5" dur="1.15s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- pelvic / reproductive node -->
    <g>
      <circle cx="580" cy="392" r="15" fill="#F472B6" opacity="0.16" filter="url(#softenSm)">
        <animate attributeName="r" values="11;20;11" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.06;0.3" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="580" cy="392" r="5" fill="#F9A8D4"/>
    </g>

    <!-- vascular node -->
    <circle cx="600" cy="336" r="3.6" fill="#7DD3FC"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="556" cy="342" r="3.2" fill="#7DD3FC"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="592" cy="248" r="3" fill="#A5B4FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>

    <!-- core -->
    <circle cx="580" cy="330" r="30" fill="#C026D3" opacity="0.2" filter="url(#soften)">
      <animate attributeName="r" values="24;38;24" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="330" r="9" fill="#F0ABFC">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <text x="580" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.4" fill="#C4B5FD">PATIENT TWIN</text>
  </g>

  <!-- output pulse into the state bar -->
  <path d="M580,606 L580,648" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.6" fill="none"/>
  <circle r="3.4" fill="#DDD6FE"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#tOut" href="#tOut"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" repeatCount="indefinite"/></circle>

  <!-- ===== twin state bar ===== -->
  <g>
    <rect x="48" y="648" width="1064" height="46" rx="10" fill="#101728" stroke="#25324D" stroke-width="1.2"/>
    <text x="68" y="676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7C8DA6">TWIN STATE</text>

    <circle cx="182" cy="671" r="3.5" fill="#34D399"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="194" y="676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">case_confidence <tspan fill="#6EE7B7">0.86</tspan></text>

    <text x="392" y="676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">cvd_risk_tier <tspan fill="#FBBF24">ELEVATED</tspan></text>

    <text x="606" y="676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">pathway_stage <tspan fill="#7DD3FC">REFERRED</tspan></text>

    <text x="820" y="676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">staleness <tspan fill="#94A3B8">3d</tspan></text>

    <text x="944" y="676" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">replayable <tspan fill="#6EE7B7">yes</tspan></text>

    <rect x="1064" y="664" width="8" height="15" fill="#A78BFA"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ===== footnotes ===== -->
  <text x="48" y="712" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748B">Dashed boundary = sandbox / governed environment. Every state transition is traceable to a source event.</text>
  <text x="1112" y="712" text-anchor="end" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748B">womens-health-digital-twin-use-cases</text>
</svg>
